name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:ui
        env:
          PYTHON: python
      - run: docker build -t parcelhub:test .
