name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:ui
        env:
          PYTHON: python
      - run: docker build -t parcelhub:test .
      - name: Start container and verify health
        run: |
          docker run --detach --name parcelhub-smoke parcelhub:test
          trap 'docker rm --force parcelhub-smoke' EXIT
          for attempt in $(seq 1 30); do
            if docker exec parcelhub-smoke python -c "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health'))['status']=='ok'; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/me'))['demo'] is True"; then
              exit 0
            fi
            sleep 2
          done
          docker logs parcelhub-smoke
          exit 1
